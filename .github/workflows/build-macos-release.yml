name: Build and release Victor for macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.1)"
        required: true
        default: "1.1.0"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos-release.yml"
      - "agent/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Check out Victor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install build dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.1.0"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Make production privacy build
        working-directory: agent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("_build_config.py")
          s = p.read_text()
          old = "PRODUCTION_BUILD: bool = False"
          if old not in s:
              raise SystemExit("Expected PRODUCTION_BUILD flag not found")
          p.write_text(s.replace(old, "PRODUCTION_BUILD: bool = True"))
          PY

      - name: Build unsigned/ad-hoc signed macOS DMG
        working-directory: agent
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
          cp "dist/Victor-${BUILD_VERSION}-mac.dmg" "dist/Victor-mac.dmg"

      - name: Verify DMG
        working-directory: agent
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/Victor-${BUILD_VERSION}-mac.dmg"
          test -f "dist/Victor-mac.dmg"
          test -d "dist/dmg-stage/Victor.app"
          test -L "dist/dmg-stage/Applications"
          test -x "dist/Victor.app/Contents/MacOS/Victor"
          test "$(plutil -extract CFBundleName raw "dist/Victor.app/Contents/Info.plist")" = "Victor"
          test "$(plutil -extract CFBundleDisplayName raw "dist/Victor.app/Contents/Info.plist")" = "Victor"
          hdiutil imageinfo "dist/Victor-${BUILD_VERSION}-mac.dmg" >/dev/null
          ls -lh "dist/Victor-${BUILD_VERSION}-mac.dmg" "dist/Victor-mac.dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victor-${{ steps.version.outputs.version }}-mac
          path: agent/dist/Victor-${{ steps.version.outputs.version }}-mac.dmg
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Victor — Early Mac Beta

          ### Install
          1. Download the `.dmg` below.
          2. Open it and drag **Victor** onto the **Applications** shortcut.
          3. Open Applications and double-click **Victor**. Victor will open the web sign-in/connection flow in your browser.
          4. Because this beta is not notarized with an Apple Developer ID, macOS may block the first launch.
          5. If blocked, open **System Settings → Privacy & Security**, scroll to **Security**, and choose **Open Anyway**, then confirm **Open**.

          This is an early beta distributed directly through GitHub.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "agent/dist/Victor-${VERSION}-mac.dmg" \
              "agent/dist/Victor-mac.dmg" \
              --clobber
            gh release edit "${TAG}" --title "Victor ${VERSION} — Early Mac Beta" --notes-file /tmp/release-notes.md
          else
            gh release create "${TAG}" \
              "agent/dist/Victor-${VERSION}-mac.dmg" \
              "agent/dist/Victor-mac.dmg" \
              --target "${GITHUB_SHA}" \
              --title "Victor ${VERSION} — Early Mac Beta" \
              --notes-file /tmp/release-notes.md
          fi
